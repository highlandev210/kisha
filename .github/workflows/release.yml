name: Release

# Push a tag like v0.1.0 (matching versionName in app/build.gradle.kts) to publish a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches versionName
        run: |
          VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match versionName $VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :core:allowance:test :app:testDebugUnitTest

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KISHA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KISHA_KEYSTORE_BASE64 secret (see scripts/create-release-key.sh)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kisha-release.jks"
          echo "KISHA_KEYSTORE_FILE=$RUNNER_TEMP/kisha-release.jks" >> "$GITHUB_ENV"

      - name: Build the signed release APK
        env:
          KISHA_KEYSTORE_PASSWORD: ${{ secrets.KISHA_KEYSTORE_PASSWORD }}
          KISHA_KEY_ALIAS: ${{ secrets.KISHA_KEY_ALIAS }}
          KISHA_KEY_PASSWORD: ${{ secrets.KISHA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify the signature and name the files
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"
          mkdir dist
          cp "$APK" "dist/kisha-$VERSION.apk"
          (cd dist && sha256sum "kisha-$VERSION.apk" > "kisha-$VERSION.apk.sha256")

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="[$VERSION]" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          if [ ! -s notes.md ]; then echo "::error::No '## [$VERSION]' section in CHANGELOG.md"; exit 1; fi

      - uses: softprops/action-gh-release@v2
        with:
          name: Kisha ${{ env.VERSION }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
