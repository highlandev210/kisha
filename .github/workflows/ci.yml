name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint and debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint, debug APK
        run: ./gradlew :core:allowance:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Keep reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/allowance/build/reports
            app/build/reports
